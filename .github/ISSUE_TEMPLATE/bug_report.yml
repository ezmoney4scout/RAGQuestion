name: 🐛 Bug 报告
description: 报告一个 Bug 以帮助我们改进项目
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请尽可能详细地填写以下信息，以便我们快速定位问题。

  - type: checkboxes
    id: terms
    attributes:
      label: 提交前检查
      description: 在提交之前，请确认以下事项
      options:
        - label: 我已搜索过现有 Issue，确认此问题未被报告
          required: true
        - label: 我使用的是项目的最新版本
          required: true
        - label: 我能够稳定复现此问题
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简明地描述你遇到的 Bug
      placeholder: 当我点击 XXX 时，应该 YYY，但实际 ZZZ
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 完整的复现步骤，让我们能在本地重现你的问题
      value: |
        1. 进入 '...'
        2. 点击 '....'
        3. 上传文件 '....'
        4. 看到错误 '....'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？请附上完整的错误信息
      render: shell
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如果适用，请附上界面截图或终端日志
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 14.2 / Ubuntu 22.04 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: 例如 3.11.5
    validations:
      required: true

  - type: input
    id: deps-version
    attributes:
      label: 关键依赖版本
      placeholder: 例如 streamlit==1.30.0, langchain==0.1.16
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: 使用的 LLM 模式
      options:
        - OpenAI
        - Ollama（本地）
        - 两者都试过
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他任何有助于定位问题的信息
    validations:
      required: false
