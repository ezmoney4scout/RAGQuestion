name: 💡 功能建议
description: 为项目提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你的想法，帮助我们理解并评估可行性。

  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 你希望解决什么问题？当前有哪些不便之处？
      placeholder: 我在使用时发现...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你理想中的实现方式是什么？
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其他方案？它们的优缺点是什么？
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 相关的文档、论文、其他项目的类似实现（附链接）
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 重要程度
      description: 这个功能对你有多重要？
      options:
        - 🔥 非常重要（阻塞我的使用）
        - ⭐ 重要（会显著改善体验）
        - 💭 锦上添花（有就更好）
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我愿意参与讨论设计方案
        - label: 我愿意测试这个功能
