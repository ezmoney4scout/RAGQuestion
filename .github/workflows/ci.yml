name: CI

# ======================================================================
# 持续集成工作流
# 触发时机：推送到 main/develop 分支或对 main 发起 PR
# ======================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

# 取消同一 PR 的重复运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================================================================
  # 1. 代码风格与静态检查
  # ======================================================================
  lint:
    name: 🧹 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

  # ======================================================================
  # 2. 语法检查与核心依赖安装测试
  # ======================================================================
  test:
    name: 🧪 Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Validate locked dependencies
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            streamlit \
            langchain \
            langchain-community \
            langchain-core \
            langchain-text-splitters \
            langchain-openai \
            pdfplumber \
            python-dotenv \
            tiktoken

      - name: Syntax check
        run: python -m compileall -q app.py config.py utils.py chains.py

      - name: Import config test
        env:
          OPENAI_API_KEY: sk-fake-key-for-ci-testing
        run: |
          python -c "
          import config
          print('✅ config OK')
          assert config.CHUNK_SIZE == 1000
          assert config.TOP_K == 4
          print('✅ config values OK')
          "

  # ======================================================================
  # 3. Docker 镜像构建测试
  # ======================================================================
  docker:
    name: 🐳 Docker 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-knowledge-base:ci
